name: Universal macOS package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pkg:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: brew install cmake pkgconf jpeg-turbo python
      - name: Run tests including native PDF rendering
        run: |
          python3 -m venv build/venv
          build/venv/bin/python -m pip install Pillow
          export PATH="$PWD/build/venv/bin:$PATH"
          make test
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-render-tests
          path: build/test/pdf-*.png
          if-no-files-found: error
      - name: Build arm64 and x86_64 filter and package
        run: sh scripts/build-pkg.sh
      - name: Verify architecture and code signature
        run: |
          lipo -info build/pkg/root/Library/Printers/Deli/filter/rastertodeli
          lipo build/pkg/root/Library/Printers/Deli/filter/rastertodeli -verify_arch arm64 x86_64
          codesign --verify --strict build/pkg/root/Library/Printers/Deli/filter/rastertodeli
          pkgutil --payload-files dist/Deli-L511W-0.1.0-universal.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: Deli-L511W-universal-macos
          path: dist/*.pkg
          if-no-files-found: error
